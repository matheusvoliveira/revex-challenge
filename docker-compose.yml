services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: revex
      POSTGRES_USER: revex
      POSTGRES_PASSWORD: revex
    volumes:
      - revex_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revex -d revex"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/revex
      SPRING_DATASOURCE_USERNAME: revex
      SPRING_DATASOURCE_PASSWORD: revex
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-min-32-bytes-ok}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-28800}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "code=$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/collaborators); test \"$$code\" = \"401\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  revex_pg:
