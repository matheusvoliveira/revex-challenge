services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: revex
      POSTGRES_USER: revex
      POSTGRES_PASSWORD: revex
    ports:
      - "5432:5432"
    volumes:
      - revex_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revex -d revex"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  revex_pg:
