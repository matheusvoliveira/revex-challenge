spring:
  application:
    name: revex-challenge
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/revex}
    username: ${SPRING_DATASOURCE_USERNAME:revex}
    password: ${SPRING_DATASOURCE_PASSWORD:revex}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-bigdecimal-as-plain: true

server:
  port: ${SERVER_PORT:8080}

revex:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-min-32-bytes-ok}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}
